<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Beauty - BachatBazaar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      .btn-cart {
        width: 36%;
      }
      .btn-buy {
        width: 63%;
      }
    </style>
  </head>
  <body>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Simple script for product buttons -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Add to Cart functionality
        const cartButtons = document.querySelectorAll(".btn-outline-danger");
        cartButtons.forEach((button) => {
          button.addEventListener("click", function () {
            const productCard = this.closest(".product-card");
            const productName = productCard.querySelector("p.mb-1").textContent;
            alert(`${productName} added to cart!`);
          });
        });

        // Buy Now functionality
        const buyButtons = document.querySelectorAll(
          ".btn-danger:not(.btn-outline-danger)"
        );
        buyButtons.forEach((button) => {
          button.addEventListener("click", function () {
            const productCard = this.closest(".product-card");
            const productName = productCard.querySelector("p.mb-1").textContent;
            alert(`Proceeding to checkout for ${productName}`);
          });
        });
      });
    </script>
  </body>
</html>
