<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Search</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container py-4">
      <!-- Search Input -->
      <div class="input-group mb-4 w-75 mx-auto">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Search products..."
        />
        <button class="btn btn-danger" id="searchBtn">
          <i class="fas fa-search"></i>
        </button>
      </div>

      <!-- Product Cards -->
      <div id="app" class="row justify-content-center"></div>
    </div>

    <!-- JavaScript -->
    <script>
      const component = {
        "wireless-earbuds": `
          <div class="col-6 col-md-3 col-lg-3 mb-4">
            <div class="product-card h-100 position-relative border rounded">
              <span class="badge bg-danger position-absolute top-0 end-0 m-2">25% OFF</span>
              <img src="./Images/Wireless Earbuds.png" alt="Wireless Earbuds" class="card-img-top" style="height: 200px; object-fit: cover" />
              <div class="p-3">
                <p class="mb-1 text-truncate">Wireless Earbuds</p>
                <p class="text-danger fw-bold mb-1">
                  Rs 1,499 <small class="text-muted"><del style="font-size: 12px">Rs 1,999</del></small>
                </p>
                <div class="progress mb-1" style="height: 5px">
                  <div class="progress-bar bg-danger" style="width: 60%"></div>
                </div>
                <small class="text-muted">Sold: 60%</small>
                <hr class="my-2" />
                <div class="rating text-warning small">
                  <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i><i class="far fa-star"></i>
                  <small class="text-muted">(42)</small>
                </div>
              </div>
            </div>
          </div>`,

        "face-cream": `
          <div class="col-6 col-md-3 col-lg-3 mb-4">
            <div class="product-card h-100 position-relative border rounded">
              <span class="badge bg-danger position-absolute top-0 end-0 m-2">30% OFF</span>
              <img src="./Images/Face Cream.png" alt="Face Cream" class="card-img-top" style="height: 200px; object-fit: cover" />
              <div class="p-3">
                <p class="mb-1 text-truncate">Vitamin C Face Cream</p>
                <p class="text-danger fw-bold mb-1">
                  Rs 499 <small class="text-muted"><del style="font-size: 12px">Rs 699</del></small>
                </p>
                <div class="progress mb-1" style="height: 5px">
                  <div class="progress-bar bg-danger" style="width: 60%"></div>
                </div>
                <small class="text-muted">Sold: 60%</small>
                <hr class="my-2" />
                <div class="rating text-warning small">
                  <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i>
                  <small class="text-muted">(90)</small>
                </div>
              </div>
            </div>
          </div>`,

        "remote-car": `
          <div class="col-6 col-md-3 col-lg-3 mb-4">
            <div class="product-card h-100 position-relative border rounded">
              <span class="badge bg-danger position-absolute top-0 end-0 m-2">15% OFF</span>
              <img src="./Images/Remote Car.png" alt="Remote Car" class="card-img-top" style="height: 200px; object-fit: cover" />
              <div class="p-3">
                <p class="mb-1 text-truncate">Remote Control Car</p>
                <p class="text-danger fw-bold mb-1">
                  Rs 999 <small class="text-muted"><del style="font-size: 12px">Rs 1,199</del></small>
                </p>
                <div class="progress mb-1" style="height: 5px">
                  <div class="progress-bar bg-danger" style="width: 60%"></div>
                </div>
                <small class="text-muted">Sold: 60%</small>
                <hr class="my-2" />
                <div class="rating text-warning small">
                  <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i><i class="far fa-star"></i><i class="far fa-star"></i>
                  <small class="text-muted">(33)</small>
                </div>
              </div>
            </div>
          </div>`,

        lipstick: `
          <div class="col-6 col-md-3 col-lg-3 mb-4">
            <div class="product-card h-100 position-relative border rounded">
              <span class="badge bg-danger position-absolute top-0 end-0 m-2">25% OFF</span>
              <img src="./Images/Lipstick.png" alt="Lipstick" class="card-img-top" style="height: 200px; object-fit: cover" />
              <div class="p-3">
                <p class="mb-1 text-truncate">Matte Lipstick</p>
                <p class="text-danger fw-bold mb-1">
                  Rs 299 <small class="text-muted"><del style="font-size: 12px">Rs 399</del></small>
                </p>
                <div class="progress mb-1" style="height: 5px">
                  <div class="progress-bar bg-danger" style="width: 60%"></div>
                </div>
                <small class="text-muted">Sold: 60%</small>
                <hr class="my-2" />
                <div class="rating text-warning small">
                  <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
                  <small class="text-muted">(18)</small>
                </div>
              </div>
            </div>
          </div>`,

        "wireless-mouse": `
          <div class="col-6 col-md-3 col-lg-3 mb-4">
            <div class="product-card h-100 position-relative border rounded">
              <span class="badge bg-danger position-absolute top-0 end-0 m-2">35% OFF</span>
              <img src="./Images/Wireless Mouse.png" alt="Wireless Mouse" class="card-img-top" style="height: 200px; object-fit: cover" />
              <div class="p-3">
                <p class="mb-1 text-truncate">Wireless Mouse</p>
                <p class="text-danger fw-bold mb-1">
                  Rs 699 <small class="text-muted"><del style="font-size: 12px">Rs 999</del></small>
                </p>
                <div class="progress mb-1" style="height: 5px">
                  <div class="progress-bar bg-danger" style="width: 60%"></div>
                </div>
                <small class="text-muted">Sold: 60%</small>
                <hr class="my-2" />
                <div class="rating text-warning small">
                  <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-alt"></i><i class="far fa-star"></i>
                  <small class="text-muted">(44)</small>
                </div>
              </div>
            </div>
          </div>`,
      };

      document.getElementById("searchBtn").addEventListener("click", () => {
        const input = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
        const appDiv = document.getElementById("app");
        appDiv.innerHTML = "";

        let found = false;
        Object.entries(component).forEach(([key, value]) => {
          if (key.includes(input)) {
            appDiv.innerHTML += value;
            found = true;
          }
        });

        if (!found) {
          appDiv.innerHTML =
            "<p class='text-center text-muted'>No products found.</p>";
        }
      });
    </script>
  </body>
</html>
