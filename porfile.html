<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuyZaar - Login/Register</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      /* Custom CSS to override Bootstrap */
      #login-form input:focus,
      #register-form input:focus,
      #login-form select:focus,
      #register-form select:focus {
        box-shadow: none !important;
        border-color: rgba(220, 53, 69, 0.8) !important;
        transition: border-color 0.3s ease;
      }

      #login-form input:hover,
      #register-form input:hover,
      #login-form select:hover,
      #register-form select:hover {
        border-color: rgba(220, 53, 69, 0.5) !important;
        transition: border-color 0.3s ease;
      }

      #login-form input,
      #register-form input,
      #login-form select,
      #register-form select {
        border: 1px solid rgba(220, 53, 69, 0.3) !important;
        transition: border-color 0.3s ease;
      }

      .input-group-text {
        background-color: white !important;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
      <div class="container">
        <a class="navbar-brand text-danger fw-bold" href="#">
          <i class="fas fa-shopping-bag me-2 text-danger"></i>BuyZaar
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link text-danger" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-danger" href="#">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active text-danger" href="#">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Footer -->
    <footer class="bg-black text-white py-4">
      <div class="container">
        <div class="row">
          <div class="col-md-6 text-center text-md-start">
            <p class="mb-0 text-danger">
              &copy; 2025 BuyZaar. All rights reserved.
            </p>
          </div>
          <div class="col-md-6 text-center text-md-end">
            <a href="#" class="text-danger me-3"
              ><i class="fab fa-facebook-f"></i
            ></a>
            <a href="#" class="text-danger me-3"
              ><i class="fab fa-twitter"></i
            ></a>
            <a href="#" class="text-danger me-3"
              ><i class="fab fa-instagram"></i
            ></a>
            <a href="#" class="text-danger"
              ><i class="fab fa-linkedin-in"></i
            ></a>
          </div>
        </div>
      </div>
    </footer>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
