<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Checkout - Red/White/Black Theme</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* Custom input and textarea styling */
      .form-control.input-custom,
      .form-select.input-custom,
      textarea.input-custom {
        border: 1px solid red !important;
        outline: none !important;
        box-shadow: none !important;
      }

      .form-control.input-custom:focus,
      .form-select.input-custom:focus,
      textarea.input-custom:focus,
      .form-control.input-custom:active,
      .form-select.input-custom:active,
      textarea.input-custom:active {
        border: 2px solid red !important;
        outline: none !important;
        box-shadow: none !important;
      }

      /* Remove Bootstrap's default focus styling */
      .form-control:focus,
      .form-select:focus,
      textarea:focus {
        border-color: transparent !important;
        box-shadow: none !important;
      }

      /* Rest of your existing styles */
      body {
        background-color: #fafafa;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        color: #333;
      }

      .card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        overflow: hidden;
        background: white;
      }

      .card-header-custom {
        background: linear-gradient(135deg, #fff, #f9f9f9);
        border-bottom: 1px solid #e8e8e8;
        padding: 1.5rem;
      }

      .section-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #121212;
        letter-spacing: -0.5px;
        position: relative;
        display: inline-block;
      }

      .section-title:after {
        content: "";
        position: absolute;
        bottom: -8px;
        left: 0;
        width: 50px;
        height: 3px;
        background: #ff2e4d;
        border-radius: 3px;
      }

      .form-label-custom {
        font-size: 0.92rem;
        font-weight: 600;
        color: #444;
        margin-bottom: 0.5rem;
      }

      .input-custom {
        padding: 0.85rem 1.25rem;
        font-size: 0.95rem;
        border-radius: 10px;
        transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        background-color: #fcfcfc;
      }

      .btn-custom {
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 12px;
        transition: all 0.3s ease;
      }

      .btn-custom-lg {
        padding: 1rem 2rem;
        font-size: 1.05rem;
      }

      .btn-danger {
        background: linear-gradient(135deg, #ff2e4d, #d91a3a);
        border: none;
        box-shadow: 0 4px 15px rgba(255, 46, 77, 0.3);
      }

      .btn-danger:hover {
        background: linear-gradient(135deg, #d91a3a, #ff2e4d);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(255, 46, 77, 0.4);
      }

      .summary-item {
        font-size: 0.95rem;
        padding: 0.5rem 0;
      }

      .summary-total {
        font-size: 1.15rem;
        font-weight: 700;
      }

      .payment-method {
        display: flex;
        gap: 12px;
        margin-top: 1rem;
      }

      .payment-card {
        width: 60px;
        height: 40px;
        background: white;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        border: 1px solid #eee;
        transition: all 0.3s ease;
      }

      footer {
        background: #121212;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 2rem 0;
        margin-top: 3rem;
      }

      @media (max-width: 992px) {
        .sticky-column {
          position: relative;
          top: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Your HTML content remains the same -->
    <div class="container py-4 py-lg-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header card-header-custom">
              <h2 class="mb-0 section-title text-danger">
                Delivery Information
              </h2>
            </div>
            <div class="card-body p-4 p-lg-5">
              <form id="deliveryForm">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label form-label-custom"
                      >Full name</label
                    >
                    <input
                      type="text"
                      id="fullName"
                      class="form-control input-custom"
                      placeholder="John Smith"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label form-label-custom"
                      >Phone Number</label
                    >
                    <input
                      type="tel"
                      id="phoneNumber"
                      class="form-control input-custom"
                      placeholder="+92 300 1234567"
                    />
                  </div>
                </div>

                <div class="mt-3">
                  <label class="form-label form-label-custom"
                    >Building Address</label
                  >
                  <input
                    type="text"
                    id="buildingAddress"
                    class="form-control input-custom"
                    placeholder="House #123, Floor 2"
                  />
                </div>

                <div class="mt-3">
                  <label class="form-label form-label-custom"
                    >Street/Landmark</label
                  >
                  <input
                    type="text"
                    id="streetLandmark"
                    class="form-control input-custom"
                    placeholder="Main Boulevard, Near Park"
                  />
                </div>

                <div class="row g-3 mt-1">
                  <div class="col-md-4">
                    <label class="form-label form-label-custom">Province</label>
                    <select id="province" class="form-select input-custom">
                      <option value="" selected>Select Province</option>
                      <option>Punjab</option>
                      <option>Sindh</option>
                      <option>Khyber Pakhtunkhwa</option>
                      <option>Balochistan</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label form-label-custom">City</label>
                    <select id="city" class="form-select input-custom">
                      <option value="" selected>Select City</option>
                      <option>Lahore</option>
                      <option>Karachi</option>
                      <option>Islamabad</option>
                      <option>Peshawar</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label form-label-custom">Area</label>
                    <select id="area" class="form-select input-custom">
                      <option value="" selected>Select Area</option>
                      <option>Gulberg</option>
                      <option>DHA</option>
                      <option>Model Town</option>
                      <option>Faisal Town</option>
                    </select>
                  </div>
                </div>

                <div class="mt-3">
                  <label class="form-label form-label-custom"
                    >Complete Address</label
                  >
                  <textarea
                    id="completeAddress"
                    class="form-control input-custom"
                    rows="3"
                    placeholder="House# 123, Street# 10, Sector ABC"
                  ></textarea>
                </div>

                <div class="mt-4">
                  <label class="form-label form-label-custom d-block mb-3"
                    >Delivery Type</label
                  >
                  <div class="d-flex gap-4">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="deliveryLabel"
                        id="home"
                        checked
                      />
                      <label class="form-check-label fw-medium" for="home">
                        <i class="fas fa-home me-2"></i> Home Delivery
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="deliveryLabel"
                        id="office"
                      />
                      <label class="form-check-label fw-medium" for="office">
                        <i class="fas fa-building me-2"></i> Office Delivery
                      </label>
                    </div>
                  </div>
                </div>

                <div class="mt-4">
                  <button
                    type="button"
                    id="saveInfoBtn"
                    class="btn btn-danger w-100 btn-custom"
                  >
                    <i class="fas fa-save me-2"></i> SAVE INFORMATION
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="sticky-top sticky-column" style="top: 30px" id="stick">
            <div class="card">
              <div class="card-header card-header-custom">
                <h3 class="mb-0 section-title text-danger">Order Summary</h3>
              </div>
              <div class="card-body p-4">
                <div
                  class="d-flex justify-content-between align-items-center summary-item"
                >
                  <span class="text-muted"
                    >Subtotal (<span id="itemCount">15</span> items)</span
                  >
                  <span class="fw-semibold"
                    >Rs. <span id="subtotal">4,800</span></span
                  >
                </div>
                <div
                  class="d-flex justify-content-between align-items-center summary-item"
                >
                  <span class="text-muted">Delivery Fee</span>
                  <span class="fw-semibold"
                    >Rs. <span id="deliveryFee">260</span></span
                  >
                </div>
                <div
                  class="d-flex justify-content-between align-items-center summary-item mb-2"
                >
                  <span class="text-muted">Taxes</span>
                  <span class="fw-semibold">Rs. <span id="taxes">0</span></span>
                </div>

                <hr class="my-3" />

                <div
                  class="d-flex justify-content-between align-items-center summary-total py-2"
                >
                  <span class="fw-bold">Total Amount</span>
                  <span class="fw-bold text-danger"
                    >Rs. <span id="totalAmount">5,060</span></span
                  >
                </div>

                <div class="mt-4">
                  <button
                    id="proceedToBuyBtn"
                    class="btn btn-danger w-100 btn-custom-lg"
                  >
                    PROCEED TO BUY <i class="fas fa-arrow-right ms-2"></i>
                  </button>
                </div>

                <div class="mt-4 pt-3">
                  <h6 class="fw-semibold mb-3">Payment Methods</h6>
                  <div class="payment-method">
                    <div class="payment-card">
                      <i class="fab fa-cc-visa text-primary"></i>
                    </div>
                    <div class="payment-card">
                      <i class="fab fa-cc-mastercard text-danger"></i>
                    </div>
                    <div class="payment-card">
                      <i class="fab fa-cc-paypal"></i>
                    </div>
                    <div class="payment-card">
                      <i class="fas fa-mobile-alt"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div
              class="card mt-4"
              style="
                background: #fafafa;
                border: 1px solid #eee;
                border-radius: 14px;
              "
            >
              <div class="card-body p-4">
                <h6 class="fw-bold mb-3">Need Help?</h6>

                <div class="d-flex align-items-center mb-3">
                  <div
                    style="
                      width: 48px;
                      height: 48px;
                      background: #ffe6ea;
                      border-radius: 12px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      margin-right: 1rem;
                      color: #ff2e4d;
                    "
                  >
                    <i class="fas fa-phone-alt"></i>
                  </div>
                  <div>
                    <div class="small text-muted">Call us 24/7</div>
                    <div class="fw-semibold">+92 21 111 111 111</div>
                  </div>
                </div>

                <div class="d-flex align-items-center">
                  <div
                    style="
                      width: 48px;
                      height: 48px;
                      background: #ffe6ea;
                      border-radius: 12px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      margin-right: 1rem;
                      color: #ff2e4d;
                    "
                  >
                    <i class="fas fa-comment-dots"></i>
                  </div>
                  <div>
                    <div class="small text-muted">Chat with us</div>
                    <div class="fw-semibold">Live Chat Support</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <p class="mb-1 small text-light opacity-70">
              &copy; 2023 Premium Store. All rights reserved.
            </p>
            <div class="d-flex justify-content-center gap-3 mt-2">
              <a href="#" class="text-light opacity-50 small">Terms</a>
              <a href="#" class="text-light opacity-50 small">Privacy</a>
              <a href="#" class="text-light opacity-50 small">Returns</a>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
