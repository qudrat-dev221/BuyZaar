<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Red/White/Black Theme</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <style>
      .step-circle {
        width: 34px;
        height: 34px;
        font-size: 0.9rem;
      }

      .section-title {
        font-size: 1.3rem;
        font-weight: 600;
        color: #dc3545; /* Red headings */
      }

      .form-label-custom {
        font-size: 0.85rem;
        font-weight: 500;
        color: #000; /* Black labels */
        margin-bottom: 0.3rem;
      }

      .summary-item {
        font-size: 0.92rem;
      }

      .summary-total {
        font-size: 1.05rem;
      }

      .input-custom {
        padding: 0.65rem 0.9rem;
        font-size: 0.9rem;
        transition: all 0.3s ease;
      }

      .input-custom:focus,
      .input-custom:active {
        border-color: #dc3545 !important;
        box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
      }

      .btn-custom {
        padding: 0.7rem 1.5rem;
        font-size: 0.95rem;
      }

      .btn-custom-lg {
        padding: 0.8rem 1.5rem;
        font-size: 1rem;
      }

      .contact-info {
        font-size: 0.92rem;
      }

      .card-header-custom {
        padding: 1rem 1.25rem;
      }

      .card-body-custom {
        padding: 1.25rem;
      }

      .form-check-label {
        font-size: 0.85rem;
        color: #000;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-3">
      <div class="row">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 card-header-custom">
              <h2 class="mb-0 section-title">Delivery Information</h2>
            </div>
            <div class="card-body card-body-custom">
              <form>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label form-label-custom"
                      >Full name</label
                    >
                    <input
                      type="text"
                      class="form-control input-custom"
                      placeholder="Enter your first and last name"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label form-label-custom"
                      >Phone Number</label
                    >
                    <input
                      type="tel"
                      class="form-control input-custom"
                      placeholder="Please enter your phone number"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label form-label-custom">
                    Building - House No - Floor - Street
                  </label>
                  <input
                    type="text"
                    class="form-control input-custom"
                    placeholder="Please enter"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label form-label-custom">
                    Colony - Suburb - Locality - Landmark
                  </label>
                  <input
                    type="text"
                    class="form-control input-custom"
                    placeholder="Please enter"
                  />
                </div>

                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label class="form-label form-label-custom">Province</label>
                    <select class="form-select input-custom">
                      <option selected>Please choose</option>
                      <option>Punjab</option>
                      <option>Sindh</option>
                      <option>Khyber Pakhtunkhwa</option>
                      <option>Balochistan</option>
                    </select>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label form-label-custom">City</label>
                    <select class="form-select input-custom">
                      <option selected>Please choose</option>
                      <option>Lahore</option>
                      <option>Karachi</option>
                      <option>Islamabad</option>
                      <option>Peshawar</option>
                    </select>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label form-label-custom">Area</label>
                    <select class="form-select input-custom">
                      <option selected>Please choose</option>
                      <option>Gulberg</option>
                      <option>DHA</option>
                      <option>Model Town</option>
                      <option>Faisal Town</option>
                    </select>
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label form-label-custom">Address</label>
                  <textarea
                    class="form-control input-custom"
                    rows="3"
                    placeholder="For Example: House# 123, Street# 123, ABC Road"
                  ></textarea>
                </div>

                <div class="mb-4">
                  <label class="form-label form-label-custom d-block mb-2">
                    Select a label for effective delivery:
                  </label>
                  <div class="d-flex gap-3">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="deliveryLabel"
                        id="office"
                      />
                      <label class="form-check-label" for="office">
                        OFFICE
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="deliveryLabel"
                        id="home"
                        checked
                      />
                      <label class="form-check-label" for="home"> HOME </label>
                    </div>
                  </div>
                </div>

                <button class="btn btn-danger w-100 btn-custom-lg">SAVE</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-4 mt-4 mt-lg-0">
          <div class="sticky-top" style="top: 20px">
            <div class="card border-0 shadow-sm">
              <div class="card-header bg-white border-0 card-header-custom">
                <h3 class="mb-0 section-title">Order Summary</h3>
              </div>
              <div class="card-body card-body-custom">
                <div class="d-flex justify-content-between mb-2 summary-item">
                  <span class="text-danger">Items Total (15 items)</span>
                  <span class="fw-bold text-danger">Rs. 4,800</span>
                </div>
                <div class="d-flex justify-content-between mb-2 summary-item">
                  <span class="text-danger">Delivery Fee</span>
                  <span class="fw-bold text-danger">Rs. 260</span>
                </div>
                <hr />
                <div class="d-flex justify-content-between mb-3 summary-total">
                  <span class="fw-bold text-danger">Total:</span>
                  <span class="fw-bold text-danger">Rs. 5,060</span>
                </div>
                <p class="text-muted small mb-4">
                  VAT included, where applicable
                </p>

                <button
                  class="btn btn-danger w-100 btn-custom-lg d-flex align-items-center justify-content-center"
                >
                  Proceed to Pay
                  <i class="bi bi-arrow-right ms-2"></i>
                </button>

                <div class="mt-4 p-3 bg-light rounded">
                  <h6 class="mb-2">Secure Payment</h6>
                  <div class="d-flex gap-2">
                    <span class="bg-white p-2 rounded border">
                      <i class="bi bi-credit-card fs-5"></i>
                    </span>
                    <span class="bg-white p-2 rounded border">
                      <i class="bi bi-paypal fs-5"></i>
                    </span>
                    <span class="bg-white p-2 rounded border">
                      <i class="bi bi-wallet fs-5"></i>
                    </span>
                  </div>
                </div>
              </div>
            </div>

            <div class="card border-0 shadow-sm mt-3">
              <div class="card-body card-body-custom">
                <h6 class="mb-3">Need Help?</h6>
                <div class="d-flex align-items-center mb-2 contact-info">
                  <i class="bi bi-telephone text-danger me-2"></i>
                  <span>+92 21 111 111 111</span>
                </div>
                <div class="d-flex align-items-center contact-info">
                  <i class="bi bi-chat text-danger me-2"></i>
                  <span>Live Chat Support</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="bg-dark text-white py-4 mt-4">
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <p class="mb-0 small">
              &copy; 2023 E-Commerce Store. All rights reserved.
            </p>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
